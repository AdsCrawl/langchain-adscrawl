[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-adscrawl"
version = "0.1.0"
description = "LangChain tool integration for AdsCrawl rendered web extraction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AdsCrawl contributors"}]
license = {file = "LICENSE"}
dependencies = ["httpx>=0.28.1,<1", "langchain-core>=1.8.0,<2", "pydantic>=2.7.4,<3"]

[project.urls]
Source = "https://github.com/AdsCrawl/langchain-adscrawl"
Documentation = "https://github.com/AdsCrawl/langchain-adscrawl"
Issues = "https://github.com/AdsCrawl/langchain-adscrawl/issues"

[project.optional-dependencies]
test = ["pytest>=9.2.0", "pytest-asyncio>=1.3.0", "pytest-socket==0.8.1", "langchain-tests==1.1.9", "respx>=0.22.0"]
lint = ["ruff>=0.14.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_adscrawl"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
