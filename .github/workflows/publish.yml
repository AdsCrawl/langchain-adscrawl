name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADSCRAWL_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check package identity and release ref
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if project["name"] != "langchain-adscrawl":
              raise SystemExit("This workflow only publishes langchain-adscrawl")
          version = project["version"]
          event = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          if event == "push" and ref != f"refs/tags/v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          if event == "workflow_dispatch" and ref not in {
              "refs/heads/main", f"refs/tags/v{version}"
          }:
              raise SystemExit("Manual publishing requires main or the matching version tag")
          print(f"Building langchain-adscrawl {version} from {ref}")
          PY
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade build twine
          python -m pip install ".[test,lint]"
      - name: Offline unit and LangChain standard unit tests
        run: python -m pytest --disable-socket --allow-unix-socket tests/unit_tests
      - name: Lint and dependency checks
        run: |
          python -m ruff check .
          python -m pip check
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/test_package.py
      - name: Install and import the built wheel without source-path imports
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I - <<'PY'
          from importlib.metadata import version
          from langchain_adscrawl import AdsCrawlReadInput, AdsCrawlReadTool
          from langchain_core.tools import BaseTool
          assert version("langchain-adscrawl")
          assert set(AdsCrawlReadInput.model_json_schema()["properties"]) == {
              "url", "content_mode", "selector"
          }
          assert issubclass(AdsCrawlReadTool, BaseTool)
          print("Built-wheel public imports and model-facing schema: PASS")
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-adscrawl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
